<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoVLSM</title>
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>
    <div class="container">
        <h2>AutoVLSM</h2>
        <form id="subnetForm">
            <label for="baseIp">Dirección IP Base:</label>
            <input type="text" id="baseIp" name="baseIp" value="168.25.0.0" required>

            <label for="hostCounts">Hosts Solicitados (separados por comas):</label>
            <input type="text" id="hostCounts" name="hostCounts" value="800,650,450,160" required>

            <button type="submit">Calcular Subneteo</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Host Solicitado</th>
                    <th>Host Encontrado</th>
                    <th>Dirección de Red</th>
                    <th>Prefijo</th>
                    <th>Máscara de Red</th>
                    <th>Primera IP Utilizable</th>
                    <th>Última IP Utilizable</th>
                    <th>Broadcast</th>
                </tr>
            </thead>
            <tbody id="results">
                <!-- Resultados se insertarán aquí -->
            </tbody>
        </table>
    </div>
</body>
<script src="./js/main.js"></script>

</html>
